<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Getaway — a heist game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="800"></canvas>
  <p id="status" class="hint" aria-live="polite">Midnight Getaway. Press Space or click to start.</p>
  <p class="hint">WASD / arrows to move · Shift to sneak · Q or click to toss a coin · E EMP the cameras · R restart · P pause · M mute</p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
